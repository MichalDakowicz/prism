<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism · Loadout · Lifts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F1F7}a:hover{color:#FFFFFF}
.lo-hide{scrollbar-width:none}
.lo-hide::-webkit-scrollbar{display:none}
@keyframes lo-load{0%{transform:translateX(var(--from));opacity:0}100%{transform:none;opacity:1}}
.lo-pl{animation:lo-load .5s cubic-bezier(.2,.9,.25,1.2) both}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0B0B0E;color:#F2F1F7;font-family:Manrope, system-ui, sans-serif">
  <div class="lo-hide" style="position:absolute;inset:0;overflow-y:auto;padding:52px 0 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <header style="padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <h1 style="margin:0;font-family:'Big Shoulders Display', Impact, sans-serif;font-weight:900;font-size:44px;line-height:1;letter-spacing:0.01em">LIFTS</h1>
      <div style="display:flex;align-items:center;gap:8px">
        <a href="loadout-profile.dc.html" aria-label="Profile and settings" style="width:48px;height:48px;border-radius:24px;background:#18181D;border:1px solid rgba(255,255,255,0.08);box-sizing:border-box;color:#F2F1F7;display:flex;align-items:center;justify-content:center;text-decoration:none">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="7" r="3.2"></circle><path d="M3.8 17c.9-3.1 3.3-4.6 6.2-4.6s5.3 1.5 6.2 4.6"></path></svg>
        </a>
        <a href="loadout-add.dc.html" aria-label="Log a new PR" style="width:48px;height:48px;border-radius:24px;background:#F2C200;color:#0B0B0E;display:flex;align-items:center;justify-content:center;text-decoration:none">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v13M3.5 10h13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg>
        </a>
      </div>
    </header>

    <div class="lo-hide" onScroll="{{onScroll}}" style="display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px;scroll-padding:0 20px">
      <sc-for list="{{cards}}" as="card" hint-placeholder-count="2">
        <a href="loadout-lift.dc.html" aria-label="{{card.lift}} record, open history" style="flex:none;width:330px;scroll-snap-align:start;background:#141417;border:1px solid rgba(255,255,255,0.06);color:#F5F4F0;text-decoration:none;border-radius:10px;padding:18px 16px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:11px;font-weight:600;letter-spacing:0.04em">
            <span>{{card.lift}}</span>
            <span style="color:#A8A6A0">{{card.meta}}</span>
          </div>
          <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px">
            <div style="display:flex;align-items:baseline;gap:6px">
              <span style="font-family:'Big Shoulders Display', Impact, sans-serif;font-weight:900;font-size:104px;line-height:0.8">{{card.kg}}</span>
              <span style="font-family:'Big Shoulders Display', Impact, sans-serif;font-weight:800;font-size:24px">KG</span>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
              <span style="font-family:'Big Shoulders Display', Impact, sans-serif;font-weight:900;font-size:17px;letter-spacing:0.04em;padding:4px 10px;border-radius:4px;background:{{card.tierBg}};color:{{card.tierFg}}">{{card.tier}}</span>
              <span style="font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:12px;font-weight:600">{{card.bw}}</span>
            </div>
          </div>
          <figure style="margin:0;display:flex;flex-direction:column;gap:6px" aria-label="{{card.loadLabel}}">
            <div style="height:100px;position:relative">
              <div style="position:absolute;left:0;right:0;top:47px;height:6px;background:#55545A;border-radius:3px"></div>
              <div style="position:absolute;left:0;width:{{card.sleeveW}}px;top:45px;height:10px;background:#8E8C87;border-radius:2px"></div>
              <div style="position:absolute;right:0;width:{{card.sleeveW}}px;top:45px;height:10px;background:#8E8C87;border-radius:2px"></div>
              <div style="position:absolute;left:5px;top:0;bottom:0;display:flex;align-items:center;gap:2px">
                <sc-for list="{{card.left}}" as="p" hint-placeholder-count="2">
                  <div class="lo-pl" style="--from:40px;width:{{p.w}}px;height:{{p.h}}px;background:{{p.c}};box-shadow:inset 0 0 0 1px {{p.edge}};border-radius:3px"></div>
                </sc-for>
                <div style="width:6px;height:22px;background:#B5B3AD;border-radius:2px;margin-left:1px"></div>
              </div>
              <div style="position:absolute;right:5px;top:0;bottom:0;display:flex;align-items:center;gap:2px">
                <div style="width:6px;height:22px;background:#B5B3AD;border-radius:2px;margin-right:1px"></div>
                <sc-for list="{{card.right}}" as="p" hint-placeholder-count="2">
                  <div class="lo-pl" style="--from:-40px;width:{{p.w}}px;height:{{p.h}}px;background:{{p.c}};box-shadow:inset 0 0 0 1px {{p.edge}};border-radius:3px"></div>
                </sc-for>
              </div>
            </div>
            <figcaption style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:11px;color:#A8A6A0">
              <span>{{card.sideL}}</span><span>BAR 20</span><span>{{card.sideR}}</span>
            </figcaption>
          </figure>
        </a>
      </sc-for>
    </div>

    <div aria-hidden="true" style="display:flex;justify-content:center;gap:6px;margin-top:-4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
        <span style="height:6px;border-radius:3px;transition:width .25s ease, background .25s ease;width:{{d.w}}px;background:{{d.c}}"></span>
      </sc-for>
    </div>

    <section aria-labelledby="lo-next" style="margin:0 20px;padding:16px;border-radius:16px;background:#141417;display:flex;align-items:center;gap:14px">
      <div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0">
        <h2 id="lo-next" style="margin:0;font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:11px;font-weight:600;color:#A8A6A0">NEXT TIER · {{next.tier}}</h2>
        <p style="margin:0;font-family:'Big Shoulders Display', Impact, sans-serif;font-weight:900;font-size:30px;line-height:1">+{{next.diff}} KG</p>
        <p style="margin:0;font-size:12px;color:#A8A6A0">{{next.perSide}} per side</p>
      </div>
      <div style="display:flex;align-items:center;gap:5px">
        <sc-for list="{{next.plates}}" as="p" hint-placeholder-count="2">
          <span style="display:flex;align-items:center;justify-content:center;border-radius:50%;font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:10px;font-weight:600;width:{{p.d}}px;height:{{p.d}}px;background:{{p.c}};box-shadow:inset 0 0 0 1px {{p.edge}};color:{{p.fg}}">{{p.label}}</span>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="lo-recent" style="padding:0 20px;display:flex;flex-direction:column;gap:2px">
      <h2 id="lo-recent" style="margin:0 0 6px;font-family:'Big Shoulders Display', Impact, sans-serif;font-weight:800;font-size:20px;letter-spacing:0.03em">RECENT PRS</h2>
      <div style="display:flex;align-items:center;gap:12px;min-height:48px">
        <span style="font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:11px;color:#A8A6A0;width:46px">12 SEP</span>
        <span style="flex:1;font-weight:700;font-size:14px">Bench press</span>
        <span style="font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:12px">100 × 1</span>
        <span style="font-size:10px;font-weight:800;padding:3px 7px;border-radius:3px;background:#F2C200;color:#0B0B0E">TIER UP</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;min-height:48px">
        <span style="font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:11px;color:#A8A6A0;width:46px">28 AUG</span>
        <span style="flex:1;font-weight:700;font-size:14px">Deadlift</span>
        <span style="font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:12px">160 × 5</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;min-height:48px">
        <span style="font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:11px;color:#A8A6A0;width:46px">09 AUG</span>
        <span style="flex:1;font-weight:700;font-size:14px">Overhead press</span>
        <span style="font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:12px">62.5 × 1</span>
      </div>
    </section>
  </div>

  <nav aria-label="Main" style="position:absolute;left:20px;right:20px;bottom:24px;height:68px;border-radius:34px;background:rgba(24,24,32,0.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.08);display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:4px;padding:6px;box-sizing:border-box">
    <a href="loadout-lifts.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:28px;background:#F2F1F7;color:#0C0C10;text-decoration:none;font-size:11px;font-weight:800">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 20V11M12 20V4M18 20v-6"></path></svg>
      Lifts
    </a>
    <a href="loadout-body.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:28px;color:#9A99A8;text-decoration:none;font-size:11px;font-weight:700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2"></circle><path d="M12 7.5v7M6.5 10h11M9 21l3-6.5 3 6.5"></path></svg>
      Body
    </a>
    <a href="loadout-plans.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:28px;color:#9A99A8;text-decoration:none;font-size:11px;font-weight:700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg>
      Plans
    </a>
    <a href="loadout-coach.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:28px;color:#9A99A8;text-decoration:none;font-size:11px;font-weight:700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"></path></svg>
      Coach
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"plates":{"editor":"enum","options":["color","black"],"default":"color"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { page: 0 };
  }
  renderVals() {
    const black = (this.props.plates ?? 'color') === 'black';
    const COLORS = { 25: '#D42A2A', 20: '#2A62D4', 15: '#F2C200', 10: '#1F9A56', 5: '#E8E8E8', 2.5: '#D42A2A', 1.25: '#B8B8B8' };
    const SIZE = { 25: [20, 96], 20: [16, 96], 15: [12, 84], 10: [10, 72], 5: [8, 56], 2.5: [6, 44], 1.25: [5, 36] };
    const PLATE = {};
    Object.keys(SIZE).forEach((k) => {
      PLATE[k] = { w: SIZE[k][0], h: SIZE[k][1], c: black ? '#0A0A0C' : COLORS[k], edge: black ? '#4A4A52' : 'transparent' };
    });
    const SET = [25, 20, 15, 10, 5, 2.5, 1.25];
    const TIERS = ['BEGINNER', 'NOVICE', 'INTERMEDIATE', 'ADVANCED', 'ELITE'];
    const TBG = ['#E8E8E8', '#1F9A56', '#F2C200', '#2A62D4', '#D42A2A'];
    const TFG = ['#0B0B0E', '#FFFFFF', '#0B0B0E', '#FFFFFF', '#FFFFFF'];
    const split = (perSide) => {
      const out = []; let rest = perSide;
      SET.forEach((p) => { while (rest >= p - 0.001) { out.push(p); rest -= p; } });
      return out;
    };
    const lifts = [
      { lift: 'BENCH PRESS', meta: 'MEASURED 1 × 1 · 12.09', kg: 100, score: 100, std: [50, 72.5, 97.5, 127.5, 162.5] },
      { lift: 'BACK SQUAT', meta: 'MEASURED 1 × 1 · 30.08', kg: 140, score: 140, std: [65, 95, 130, 170, 215] },
      { lift: 'DEADLIFT', meta: '160 × 5 · EST. 1RM 180', kg: 160, score: 180, std: [80, 115, 155, 200, 250] },
      { lift: 'OVERHEAD PRESS', meta: 'MEASURED 1 × 1 · 09.08', kg: 62.5, score: 62.5, std: [32.5, 47.5, 65, 87.5, 112.5] }
    ];
    const BW = 82;
    const cards = lifts.map((l) => {
      let t = 0; l.std.forEach((v, i) => { if (l.score >= v) t = i; });
      const side = split((l.kg - 20) / 2);
      const plates = side.map((p) => PLATE[p]);
      return {
        lift: l.lift, meta: l.meta, kg: l.kg, tier: TIERS[t], tierBg: TBG[t], tierFg: TFG[t],
        bw: (l.score / BW).toFixed(2) + ' × BW',
        left: plates.slice().reverse(), right: plates,
        sleeveW: 5 + plates.reduce((a, p) => a + p.w + 2, 0) + 7,
        sideL: side.slice().reverse().join(' + '), sideR: side.join(' + '),
        loadLabel: '20 kg bar with ' + side.join(', ') + ' kg per side',
        t, std: l.std, score: l.score
      };
    });
    const page = Math.max(0, Math.min(cards.length - 1, this.state.page));
    const cur = cards[page];
    const nt = Math.min(4, cur.t + 1);
    const diff = Math.max(0, cur.std[nt] - cur.score);
    const perSide = split(diff / 2);
    const DISC = { 25: 40, 20: 38, 15: 36, 10: 34, 5: 30, 2.5: 26, 1.25: 24 };
    return {
      cards,
      dots: cards.map((c, i) => ({ w: i === page ? 20 : 6, c: i === page ? '#F2C200' : '#3A3A42' })),
      next: {
        tier: TIERS[nt], diff: diff % 1 ? diff.toFixed(1) : String(diff),
        perSide: perSide.join(' + ') + ' kg',
        plates: perSide.map((p) => ({ label: String(p), d: DISC[p], c: black ? '#0A0A0C' : PLATE[p].c, edge: black ? '#4A4A52' : 'transparent', fg: !black && (p === 15 || p === 5 || p === 1.25) ? '#0B0B0E' : '#FFFFFF' }))
      },
      onScroll: (e) => {
        const p = Math.round(e.currentTarget.scrollLeft / 340);
        if (p !== this.state.page) this.setState({ page: p });
      }
    };
  }
}
</script>
</body>
</html>
