  constructor(props) {

    this.state = { load: -1, vol: 0, swap: -1, len: 0 };
  }
  renderVals() {
    const s = this.state;
    const base = [
      { name: 'EZ-bar curl', sets: 4, reps: '8–10', w: 35, step: 2.5 },
      s.swap < 0 ? { name: 'Cable pushdown', sets: 4, reps: '10–12', w: 30, step: 2.5, swapped: true }
        : s.swap > 0 ? { name: 'Weighted dip', sets: 4, reps: '6–8', w: 15, step: 2.5, swapped: true, plus: true }

      { name: 'Overhead extension', sets: 3, reps: '12', w: 25, step: 2.5 },
      { name: 'Hammer curl', sets: 3, reps: '10', w: 18, step: 1 },
      { name: 'Reverse-grip curl', sets: 3, reps: '12', w: 20, step: 2.5, added: true }
    ];
    const count = 5 + s.len;
    const list = base.slice(0, count).map((e) => {
      const w = Math.round(e.w * (1 + 0.05 * s.load) / e.step) * e.step;
      const sets = Math.max(2, e.sets + s.vol);
      const changed = !!(e.swapped || e.added || s.load || s.vol);
      return { name: e.name, sets, scheme: sets + '×' + e.reps, weight: (e.plus ? '+' : '') + w, col: changed ? '#F2C200' : '#F2F1F7', changed };
    });
    const totalSets = list.reduce((a, e) => a + e.sets, 0);
    const minutes = Math.round(totalSets * 3.25 / 5) * 5;
    const changedN = list.filter((e) => e.changed).length;
    const sign = (n, unit) => (n === 0 ? 'As planned' : (n > 0 ? '+' : '−') + Math.abs(n) + unit);
    const mk = (id, label, key, min, max, value) => ({
      id: 'lo-' + id, label, min, max, v: s[key], value,
      col: s[key] !== 0 ? '#F2C200' : '#A8A6A0',
      set: (e) => { const n = {}; n[key] = Number(e.target.value); this.setState(n); }
    });
    return {
      count: list.length, minutes,
      preview: list.slice(0, 3),
      moreLabel: list.length > 3 ? '+ ' + (list.length - 3) + ' more' : '',
      sliders: [
        mk('load', 'LOAD', 'load', -2, 2, sign(s.load * 5, '%')),
        mk('vol', 'SETS / REPS', 'vol', -1, 2, sign(s.vol, ' set each')),
        mk('swap', 'EXERCISE CHOICE', 'swap', -1, 1, s.swap === 0 ? 'As planned' : s.swap < 0 ? 'Easier swap' : 'Harder swap'),
        mk('len', 'SESSION LENGTH', 'len', -2, 1, '~' + minutes + ' min')
      ],
      summary: changedN ? changedN + ' of ' + list.length + ' exercises change · nothing saved yet' : 'No changes',
      reset: () => this.setState({ load: 0, vol: 0, swap: 0, len: 0 })
    };
  }
}
</script>
