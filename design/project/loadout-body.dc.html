  renderVals() {
    const VOL = {
      pectorals: 10, front_delts: 6, side_delts: 8, rear_delts: 6, biceps: 14, triceps: 12, forearms: 9,

    };

    const sel = this.state.sel;
    const same = (a, b) => a === b || (a === 'traps' && b === 'trapezius') || (a === 'trapezius' && b === 'traps');

    const plans = v === 0 ? 'NOT IN ANY PLAN' : v >= 9 ? 'IN 2 PLANS' : 'IN 1 PLAN';
    const front = this.state.side === 'front';
    return {
      c, k, pick,
      isFront: front, isBack: !front,
      frontPressed: front ? 'true' : 'false', backPressed: front ? 'false' : 'true',
      frontBg: front ? '#F2F1F7' : 'transparent', frontFg: front ? '#0B0B0E' : '#A8A6A0',
      backBg: front ? 'transparent' : '#F2F1F7', backFg: front ? '#A8A6A0' : '#0B0B0E',
      showFront: () => this.setState({ side: 'front' }),
      showBack: () => this.setState({ side: 'back' }),
      selName: NAME[sel], selColor: ramp(v),
      selMeta: v + ' SETS / WK · ' + plans
    };
  }
}
</script>
